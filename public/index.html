<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AskCricket — Agentic IPL Analyst</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .chip-enter { animation: slideIn 200ms ease-out both; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 300ms ease-out both; }

    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.3; }
      40%            { opacity: 1; }
    }
    .dot { display: inline-block; animation: pulse-dot 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes countUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .count-up { animation: countUp 400ms ease-out both; }

    #chat-history::-webkit-scrollbar { width: 4px; }
    #chat-history::-webkit-scrollbar-track { background: transparent; }
    #chat-history::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .player-link {
      color: #059669;
      cursor: pointer;
      border-bottom: 1px dashed #059669;
      transition: color 120ms;
    }
    .player-link:hover { color: #047857; }

    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .stat-card { transition: transform 150ms, box-shadow 150ms; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-3 sticky top-0 z-10 shadow-sm">
    <div class="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center text-white text-lg font-bold shadow-sm">🏏</div>
    <div>
      <h1 class="font-bold text-gray-900 leading-none">AskCricket</h1>
      <p class="text-xs text-gray-400 leading-none mt-0.5">Agentic IPL analyst · IPL 2024</p>
    </div>
    <div class="ml-auto flex items-center gap-3">
      <span class="hidden sm:flex items-center gap-1.5 text-xs text-gray-400 bg-emerald-50 border border-emerald-100 px-2.5 py-1 rounded-full">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Live agent
      </span>
      <button id="clear-btn" class="text-xs text-gray-400 hover:text-gray-700 px-3 py-1.5 rounded-lg hover:bg-gray-100 transition-colors">
        Clear chat
      </button>
    </div>
  </header>

  <!-- Main -->
  <div class="flex-1 flex flex-col max-w-3xl mx-auto w-full px-4 pb-4">

    <!-- Chat history -->
    <div id="chat-history" class="flex-1 overflow-y-auto py-6 space-y-6 min-h-0" style="max-height: calc(100vh - 210px)">

      <!-- Stats dashboard -->
      <div id="stats-dashboard" class="fade-up">

        <!-- Hero -->
        <div class="text-center mb-8 pt-2">
          <div class="inline-flex items-center gap-2 bg-emerald-50 border border-emerald-100 text-emerald-700 text-xs font-medium px-3 py-1.5 rounded-full mb-4">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            Ball-by-ball IPL 2024 data
          </div>
          <h2 class="text-2xl font-bold text-gray-900 mb-1">Your personal IPL analyst</h2>
          <p class="text-gray-500 text-sm">Ask anything — the agent reads every delivery to answer.</p>
        </div>

        <!-- Stat cards -->
        <div id="stat-cards" class="grid grid-cols-3 gap-3 mb-8"></div>

        <!-- Suggestions -->
        <div>
          <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-3">Try asking</p>
          <div class="flex flex-col gap-2">
            <button class="suggestion group text-left w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-white border border-gray-200 hover:border-emerald-300 hover:bg-emerald-50 transition-all text-sm text-gray-700 shadow-sm">
              <span class="text-emerald-500 text-base">🏏</span>
              <span>Was Kohli clutch in the 2024 season?</span>
              <span class="ml-auto text-gray-300 group-hover:text-emerald-400 transition-colors">→</span>
            </button>
            <button class="suggestion group text-left w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-white border border-gray-200 hover:border-emerald-300 hover:bg-emerald-50 transition-all text-sm text-gray-700 shadow-sm">
              <span class="text-emerald-500 text-base">⚡</span>
              <span>Compare Bumrah vs Rashid Khan in death overs</span>
              <span class="ml-auto text-gray-300 group-hover:text-emerald-400 transition-colors">→</span>
            </button>
            <button class="suggestion group text-left w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-white border border-gray-200 hover:border-emerald-300 hover:bg-emerald-50 transition-all text-sm text-gray-700 shadow-sm">
              <span class="text-emerald-500 text-base">🏆</span>
              <span>Who should I pick as captain for CSK vs MI?</span>
              <span class="ml-auto text-gray-300 group-hover:text-emerald-400 transition-colors">→</span>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- Input area -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-sm p-3 mt-3">
      <!-- Reasoning trace -->
      <div id="trace" class="flex flex-wrap gap-1.5 mb-2 empty:hidden"></div>

      <form id="ask-form" class="flex gap-2">
        <input
          id="q"
          type="text"
          autocomplete="off"
          class="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm
                 focus:outline-none focus:border-emerald-400 focus:bg-white transition-all placeholder-gray-400"
          placeholder="Ask anything about IPL 2024…"
        />
        <button
          type="submit"
          id="submit-btn"
          class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-40 disabled:cursor-not-allowed
                 text-white rounded-xl text-sm font-semibold transition-colors shadow-sm"
        >
          Ask
        </button>
      </form>
    </div>

  </div>

  <script src="/app.js"></script>
</body>
</html>
